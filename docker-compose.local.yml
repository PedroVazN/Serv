# MongoDB local isolado, com replica set para os aceites transacionais.
services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_local:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); }'
          && mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'
      interval: 5s
      timeout: 10s
      retries: 20
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/serv_desenvolvimento?replicaSet=rs0
      MONGODB_DB_NAME: serv_desenvolvimento
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 bytes no ambiente}
      PORT: 3000
      SERVE_FRONTEND: "true"
      FRONTEND_PATH: /app/frontend
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo_local:
