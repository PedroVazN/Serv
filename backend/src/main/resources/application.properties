spring.application.name=serv-api
server.port=${PORT:3000}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
spring.servlet.multipart.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
serv.mongodb-uri=${MONGODB_URI:mongodb://localhost:27017/serv_desenvolvimento?replicaSet=rs0}
serv.mongodb-database=${MONGODB_DB_NAME:}
serv.jwt-secret=${JWT_SECRET:}
serv.jwt-expires-in=${JWT_EXPIRES_IN:7d}
serv.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
serv.frontend-path=${FRONTEND_PATH:../frontend/dist}
serv.serve-frontend=${SERVE_FRONTEND:false}
serv.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
logging.level.org.mongodb.driver=WARN
