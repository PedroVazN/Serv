name: Java Spring Boot and React
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name mongo-test -p 27017:27017 mongo:8.0 mongod --replSet rs0 --bind_ip_all
          for n in $(seq 1 30); do
            if docker exec mongo-test mongosh --quiet --eval 'db.adminCommand({ping: 1})'; then break; fi
            sleep 1
          done
          docker exec mongo-test mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for n in $(seq 1 30); do
            if docker exec mongo-test mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify Java API
        working-directory: backend
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
        run: sh mvnw -B verify
      - name: Build React
        working-directory: frontend
        run: npm ci && npm run build
